<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b07">
<title>PH Power Coach — Panel del Entrenador</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{color-scheme:dark;--bg:#0a0b07;--surface:#17190f;--surface2:#23271a;--border:#2d3222;--ink:#f4f8ea;--dim:#9ba38a;--accent:#c4ff1a;--violet:#c45bff;--bad:#ff5468;--shadow:0 10px 28px rgba(0,0,0,.45);--radius:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(100% 50% at 50% -10%,rgba(196,255,26,.15),transparent 60%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}.shell{max-width:760px;margin:auto;padding:0 16px 90px}.top{padding:calc(18px + env(safe-area-inset-top)) 4px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand small{display:block;color:var(--dim);font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.brand h1{margin:2px 0 0;font-size:30px;line-height:1}.brand h1 span{color:var(--accent);text-shadow:0 0 18px rgba(196,255,26,.45)}.personal{color:var(--dim);text-decoration:none;font-size:12px;font-weight:800;border:1px solid var(--border);border-radius:999px;padding:9px 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:8px 0 16px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}.stat b{display:block;color:var(--accent);font-size:25px}.stat span{color:var(--dim);font-size:10px;font-weight:700;text-transform:uppercase}.toolbar{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:14px}.search,input,select,textarea{width:100%;border:1.5px solid transparent;border-radius:12px;background:var(--surface2);color:var(--ink);padding:11px 12px}.search:focus,input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}.primary{border:0;border-radius:999px;background:var(--accent);color:#0a0b07;font-weight:850;padding:0 17px;cursor:pointer;box-shadow:0 0 18px rgba(196,255,26,.3)}.section-title{color:var(--dim);font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;margin:16px 4px 9px}.clients{display:flex;flex-direction:column;gap:10px}.client{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:46px 1fr auto;gap:11px;align-items:center}.avatar{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--violet),#76269f);display:grid;place-items:center;font-size:18px;font-weight:900}.client h3{font-size:15px;margin:0 0 3px}.meta{color:var(--dim);font-size:11.5px;line-height:1.4}.badge{font-size:10px;font-weight:850;border-radius:999px;padding:5px 8px;white-space:nowrap}.active{background:rgba(196,255,26,.12);color:var(--accent)}.paused{background:rgba(255,84,104,.13);color:var(--bad)}.client-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.client-actions button,.client-actions a{border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--ink);text-decoration:none;text-align:center;padding:9px 5px;font-size:11.5px;font-weight:800;cursor:pointer}.client-actions .open{border-color:var(--accent);color:var(--accent)}.empty{text-align:center;color:var(--dim);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 16px;line-height:1.5}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.74);z-index:30;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{background:var(--surface);border:1px solid var(--border);border-radius:24px 24px 0 0;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sheet-head h2{font-size:21px;margin:0}.close{border:1px solid var(--border);background:var(--surface2);color:var(--dim);border-radius:50%;width:36px;height:36px;cursor:pointer}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field.full{grid-column:1/-1}.field label{display:block;color:var(--dim);font-size:10px;font-weight:800;text-transform:uppercase;margin:0 0 4px 2px}.field textarea{min-height:76px;resize:vertical}.save{width:100%;min-height:46px;margin-top:13px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.detail-box{background:var(--surface2);border-radius:13px;padding:11px}.detail-box small{display:block;color:var(--dim);font-size:10px;text-transform:uppercase;font-weight:800}.detail-box b{display:block;margin-top:4px;font-size:14px}.notes{background:var(--surface2);border-radius:13px;padding:12px;margin-top:10px;color:var(--dim);font-size:13px;line-height:1.45}.danger{width:100%;border:1px solid var(--bad);color:var(--bad);background:transparent;border-radius:12px;padding:11px;margin-top:12px;font-weight:800;cursor:pointer}.toast{position:fixed;z-index:50;left:50%;bottom:24px;transform:translate(-50%,10px);background:var(--accent);color:#0a0b07;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:850;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:10px 8px}.stat b{font-size:22px}.toolbar{grid-template-columns:1fr}.primary{min-height:44px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.client{grid-template-columns:42px 1fr auto}.avatar{width:42px;height:42px}.client-actions{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="brand"><small>Panel del entrenador</small><h1>PH <span>POWER</span> COACH</h1></div><a class="personal" href="./index.html">Mi entrenamiento</a></header>
  <section class="stats"><div class="stat"><b id="stat-total">0</b><span>Clientes</span></div><div class="stat"><b id="stat-active">0</b><span>Activos</span></div><div class="stat"><b id="stat-checkins">0</b><span>Revisiones</span></div></section>
  <div class="toolbar"><input class="search" id="search" type="search" placeholder="Buscar cliente…"><button class="primary" id="new-client">＋ Nuevo cliente</button></div>
  <div class="section-title">Mis clientes</div><div class="clients" id="clients"></div>
</div>

<div class="overlay" id="form-overlay"><section class="sheet"><div class="sheet-head"><h2 id="form-title">Nuevo cliente</h2><button class="close" data-close="form-overlay">✕</button></div><input id="client-id" type="hidden"><div class="form-grid">
  <div class="field full"><label>Nombre completo</label><input id="client-name" maxlength="80" placeholder="Nombre del cliente"></div>
  <div class="field"><label>Teléfono / WhatsApp</label><input id="client-phone" inputmode="tel" maxlength="20" placeholder="8095551234"></div>
  <div class="field"><label>Estado</label><select id="client-status"><option value="active">Activo</option><option value="paused">Pausado</option></select></div>
  <div class="field"><label>Objetivo</label><select id="client-goal"><option>Ganar masa muscular</option><option>Perder grasa</option><option>Fuerza</option><option>Rendimiento deportivo</option><option>Salud general</option><option>Otro</option></select></div>
  <div class="field"><label>Peso actual (lb)</label><input id="client-weight" type="number" min="50" max="700" step="0.1" inputmode="decimal"></div>
  <div class="field"><label>Plan</label><input id="client-plan" maxlength="50" placeholder="Ej. Mensual 3 días"></div>
  <div class="field"><label>Próxima revisión</label><input id="client-checkin" type="date"></div>
  <div class="field full"><label>Notas del entrenador</label><textarea id="client-notes" maxlength="500" placeholder="Lesiones, preferencias, observaciones…"></textarea></div>
</div><button class="primary save" id="save-client">Guardar cliente</button></section></div>

<div class="overlay" id="detail-overlay"><section class="sheet"><div class="sheet-head"><h2 id="detail-name">Cliente</h2><button class="close" data-close="detail-overlay">✕</button></div><div id="detail-content"></div></section></div>
<div class="toast" id="toast"></div>
<script>
(function(){"use strict";
var KEY="phpower-coach-clients-v1",clients=load(),filter="";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(clients))}
function esc(value){return String(value==null?"":value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function initials(name){return String(name).trim().split(/\s+/).slice(0,2).map(function(p){return p[0]||""}).join("").toUpperCase()||"?"}
function phoneLink(phone){return String(phone||"").replace(/\D/g,"")}
function dateText(value){if(!value)return"Sin fecha";var d=new Date(value+"T12:00:00");return d.toLocaleDateString("es-DO",{day:"numeric",month:"short",year:"numeric"})}
function toast(message){var el=document.getElementById("toast");el.textContent=message;el.classList.add("show");setTimeout(function(){el.classList.remove("show")},1800)}
function dueSoon(client){if(!client.checkin||client.status!=="active")return false;var today=new Date();today.setHours(0,0,0,0);var due=new Date(client.checkin+"T00:00:00");return due.getTime()<=today.getTime()+7*86400000}
function render(){var visible=clients.filter(function(c){return !filter||c.name.toLowerCase().indexOf(filter)>-1||(c.phone||"").indexOf(filter)>-1});document.getElementById("stat-total").textContent=clients.length;document.getElementById("stat-active").textContent=clients.filter(function(c){return c.status==="active"}).length;document.getElementById("stat-checkins").textContent=clients.filter(dueSoon).length;var root=document.getElementById("clients");if(!visible.length){root.innerHTML='<div class="empty">'+(clients.length?'No encontramos clientes con esa búsqueda.':'Aún no tienes clientes.<br>Agrega el primero para comenzar a organizar sus planes.')+'</div>';return}root.innerHTML=visible.map(function(c){var wa=phoneLink(c.phone);return '<article class="client"><div class="avatar">'+initials(c.name)+'</div><div><h3>'+esc(c.name)+'</h3><div class="meta">'+esc(c.goal)+' · '+esc(c.plan||"Sin plan")+'<br>Revisión: '+dateText(c.checkin)+'</div></div><span class="badge '+c.status+'">'+(c.status==="active"?'Activo':'Pausado')+'</span><div class="client-actions"><button class="open" data-open="'+c.id+'">Ver ficha</button><button data-edit="'+c.id+'">Editar</button>'+(wa?'<a href="https://wa.me/'+wa+'" target="_blank" rel="noopener">WhatsApp</a>':'<button data-edit="'+c.id+'">Agregar tel.</button>')+'</div></article>'}).join("");wireCards()}
function wireCards(){document.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){showDetail(b.dataset.open)}});document.querySelectorAll("[data-edit]").forEach(function(b){b.onclick=function(){openForm(b.dataset.edit)}})}
function openForm(id){var c=id?clients.find(function(x){return x.id===id}):null;document.getElementById("form-title").textContent=c?"Editar cliente":"Nuevo cliente";document.getElementById("client-id").value=c?c.id:"";document.getElementById("client-name").value=c?c.name:"";document.getElementById("client-phone").value=c?c.phone||"":"";document.getElementById("client-status").value=c?c.status:"active";document.getElementById("client-goal").value=c?c.goal:"Ganar masa muscular";document.getElementById("client-weight").value=c&&c.weight!=null?c.weight:"";document.getElementById("client-plan").value=c?c.plan||"":"";document.getElementById("client-checkin").value=c?c.checkin||"":"";document.getElementById("client-notes").value=c?c.notes||"":"";document.getElementById("form-overlay").classList.add("show");setTimeout(function(){document.getElementById("client-name").focus()},100)}
function saveClient(){var name=document.getElementById("client-name").value.trim();if(!name){toast("Escribe el nombre del cliente");return}var id=document.getElementById("client-id").value,existing=id?clients.find(function(c){return c.id===id}):null;var weight=parseFloat(document.getElementById("client-weight").value);var data={id:id||"cl-"+Date.now(),name:name,phone:document.getElementById("client-phone").value.trim(),status:document.getElementById("client-status").value,goal:document.getElementById("client-goal").value,weight:isNaN(weight)?null:weight,plan:document.getElementById("client-plan").value.trim(),checkin:document.getElementById("client-checkin").value,notes:document.getElementById("client-notes").value.trim(),createdAt:existing?existing.createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};if(existing)clients[clients.indexOf(existing)]=data;else clients.unshift(data);persist();close("form-overlay");render();toast(existing?"Cliente actualizado":"Cliente agregado")}
function showDetail(id){var c=clients.find(function(x){return x.id===id});if(!c)return;document.getElementById("detail-name").textContent=c.name;document.getElementById("detail-content").innerHTML='<div class="detail-grid"><div class="detail-box"><small>Objetivo</small><b>'+esc(c.goal)+'</b></div><div class="detail-box"><small>Peso actual</small><b>'+(c.weight!=null?esc(c.weight)+' lb':'Sin registrar')+'</b></div><div class="detail-box"><small>Plan</small><b>'+esc(c.plan||"Sin asignar")+'</b></div><div class="detail-box"><small>Próxima revisión</small><b>'+dateText(c.checkin)+'</b></div></div><div class="notes">'+(c.notes?esc(c.notes):'Sin notas del entrenador.')+'</div><button class="danger" id="delete-client">Eliminar cliente</button>';document.getElementById("delete-client").onclick=function(){if(!confirm("¿Eliminar a "+c.name+" del panel?"))return;clients=clients.filter(function(x){return x.id!==c.id});persist();close("detail-overlay");render();toast("Cliente eliminado")};document.getElementById("detail-overlay").classList.add("show")}
function close(id){document.getElementById(id).classList.remove("show")}
document.getElementById("new-client").onclick=function(){openForm()};document.getElementById("save-client").onclick=saveClient;document.getElementById("search").oninput=function(e){filter=e.target.value.trim().toLowerCase();render()};document.querySelectorAll("[data-close]").forEach(function(b){b.onclick=function(){close(b.dataset.close)}});document.querySelectorAll(".overlay").forEach(function(o){o.addEventListener("click",function(e){if(e.target===o)close(o.id)})});render();
})();
</script>
</body>
</html>
