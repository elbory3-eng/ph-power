<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PH Power — Registro de Entrenamiento</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PH Power">
<meta name="application-name" content="PH Power">
<meta name="theme-color" content="#0a0b07">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<style>
  /* Tema neón: negro + lima + violeta (siempre oscuro para que resalten los colores) */
  :root {
    color-scheme: dark;
    --bg: #0a0b07;
    --surface: #17190f;
    --surface-2: #23271a;
    --border: #2d3222;
    --ink: #f4f8ea;
    --ink-dim: #9ba38a;
    --accent: #c4ff1a;
    --accent-ink: #0a0b07;
    --accent-glow: 0 0 18px rgba(196,255,26,.45);
    --violet: #c45bff;
    --pr: #d27cff;
    --pr-soft: rgba(196,91,255,.16);
    --good: #c4ff1a;
    --good-soft: rgba(196,255,26,.12);
    --bad: #ff5468;
    --bad-soft: rgba(255,84,104,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45);
    --radius: 20px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    overscroll-behavior-y: none;
    -webkit-user-select: none;
    user-select: none;
  }
  input, textarea {
    -webkit-user-select: auto;
    user-select: auto;
  }
  body {
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(196,255,26,.16), transparent 60%),
      radial-gradient(80% 40% at 100% 0%, rgba(196,91,255,.10), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  #app { width: 100%; max-width: 560px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

  .num, input[type="number"] { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  header.top {
    padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 14px;
    display: flex; flex-direction: column; gap: 2px;
  }
  header.top .kicker {
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-dim); font-weight: 700;
  }
  header.top h1 {
    margin: 0;
    font-weight: 800;
    font-size: 34px;
    letter-spacing: -.01em;
    text-wrap: balance;
    transform: scaleX(.86);
    transform-origin: left;
  }
  header.top h1 span { color: var(--accent); text-shadow: var(--accent-glow); }

  nav.days {
    display: flex; gap: 8px; padding: 0 20px 16px;
    overflow-x: auto;
  }
  nav.days button {
    flex: none;
    font: inherit; font-weight: 700; font-size: 13px;
    padding: 9px 14px; border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--ink-dim);
    cursor: pointer;
  }
  nav.days button .tag {
    display: block; font-size: 9px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; opacity: .7; margin-top: 1px;
  }
  nav.days button.active {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
    box-shadow: var(--accent-glow);
  }

  main { padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 14px; }

  .day-note {
    font-size: 13px; color: var(--ink-dim); padding: 2px 4px 6px;
    display: flex; align-items: center; gap: 6px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; padding: 14px 16px 10px;
  }
  .card-head.with-thumb { align-items: center; }
  .card-head.with-thumb h2 { flex: 1; }
  .ex-thumb {
    flex: none; width: 64px; height: 64px; border-radius: 16px;
    object-fit: cover; background: var(--surface-2);
    border: 1.5px solid var(--border);
  }
  .card-head h2 {
    margin: 0; font-size: 17px; font-weight: 750; text-wrap: balance;
    letter-spacing: -.005em;
    transform: scaleX(.92); transform-origin: left;
  }
  .scheme {
    font-size: 12px; font-weight: 700; color: var(--ink-dim);
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .rest-chip {
    font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    color: var(--ink-dim); padding: 0 16px 8px; margin-top: -4px;
  }
  .suggest {
    margin: 0 16px 10px; padding: 7px 10px; border-radius: 9px;
    font-size: 12.5px; font-weight: 600;
    background: var(--pr-soft); color: var(--pr);
    display: flex; align-items: center; gap: 6px;
  }

  .sets { display: flex; flex-direction: column; }
  .set-row {
    display: grid;
    grid-template-columns: 44px 1fr 1fr 44px;
    gap: 8px;
    align-items: center;
    padding: 7px 16px;
    border-top: 1px solid var(--border);
  }
  .set-row .label { font-size: 12px; font-weight: 700; color: var(--ink-dim); }
  .set-row input {
    width: 100%; font: inherit; font-size: 16px; font-weight: 700;
    color: var(--ink); background: var(--surface-2);
    border: 1.5px solid transparent; border-radius: 9px;
    padding: 9px 8px; text-align: center;
  }
  .set-row input::placeholder { color: var(--ink-dim); font-weight: 500; opacity: .6; font-size: 14px; }
  .set-row input:focus-visible { outline: none; border-color: var(--accent); }
  .set-row .check {
    width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--surface-2); color: var(--ink-dim);
    font-size: 17px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .set-row .check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .set-row.done { background: var(--good-soft); }
  .set-row.done .check { background: var(--good); border-color: var(--good); color: var(--accent-ink); box-shadow: var(--accent-glow); }
  .set-row.done input { background: transparent; }
  .set-row.done.under { background: var(--pr-soft); }
  .set-row.done.under .check { background: var(--violet); border-color: var(--violet); color: #fff; box-shadow: 0 0 16px rgba(196,91,255,.5); }

  /* Feedback táctil nativo en móvil */
  button:active, .check:active, .btn-outline:active {
    transform: scale(0.96);
    transition: transform 0.08s ease;
  }

  .counter {
    font-size: 11px; font-weight: 700; color: var(--ink-dim);
    background: var(--surface-2); padding: 3px 8px; border-radius: 999px;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .counter.full { background: var(--good-soft); color: var(--good); }

  .note-wrap { padding: 2px 16px 12px; }
  .note-input {
    width: 100%; font: inherit; font-size: 14px; color: var(--ink-dim);
    background: var(--surface-2); border: 1px solid transparent; border-radius: 9px;
    padding: 8px 10px; resize: none; min-height: 38px; line-height: 1.35;
  }
  .note-input:focus-visible { outline: none; border-color: var(--accent); color: var(--ink); }
  .note-input::placeholder { color: var(--ink-dim); opacity: .6; }

  .cardio-row {
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .cardio-row p { margin: 0; font-size: 13.5px; color: var(--ink-dim); }
  .cardio-row button {
    flex: none; font: inherit; font-weight: 700; font-size: 13px;
    padding: 10px 16px; min-height: 44px; border-radius: 9px; border: 1.5px solid var(--border);
    background: var(--surface-2); color: var(--ink); cursor: pointer;
  }
  .cardio-row button.done { background: var(--good-soft); color: var(--good); border-color: var(--good); }

  .finish {
    margin: 8px 4px 0;
    min-height: 52px;
    padding: 15px; border-radius: 999px; border: none;
    background: var(--accent); color: var(--accent-ink); box-shadow: var(--accent-glow);
    font: inherit; font-weight: 800; font-size: 16px; letter-spacing: .01em;
    cursor: pointer;
  }
  .finish:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .finish[disabled] { opacity: .45; }

  /* Rest timer sheet */
  #timer {
    position: fixed; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    display: none; justify-content: center; z-index: 20;
    padding: 0 16px;
  }
  #timer.show { display: flex; }
  #timer .box {
    width: 100%; max-width: 528px;
    background: var(--surface-2); color: var(--ink); border: 1.5px solid var(--accent);
    border-radius: 999px; box-shadow: var(--shadow), var(--accent-glow);
    padding: 10px 12px 10px 22px; display: flex; align-items: center; gap: 12px;
  }
  #timer .clock {
    font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 64px;
    color: var(--accent);
  }
  #timer .exname { font-size: 12px; opacity: .7; flex: 1; }
  #timer button {
    font: inherit; font-weight: 700; font-size: 12px; border: none; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); padding: 9px 16px; border-radius: 999px;
  }
  @media (prefers-reduced-motion: no-preference) {
    #timer.show .clock.pulse { animation: pulse 1s ease-in-out infinite; }
  }
  @keyframes pulse { 50% { opacity: .55; } }

  /* Bottom nav móvil ergonómica */
  nav.bottom {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 10;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    width: calc(100% - 24px); max-width: 536px;
    display: flex; gap: 4px; background: rgba(23,25,15,.88); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px; box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  nav.bottom button {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    min-height: 48px;
    font: inherit; background: none; border: none; cursor: pointer;
    padding: 4px; color: var(--ink-dim); font-size: 11px; font-weight: 700;
    border-radius: 999px; transition: background .2s, color .2s;
  }
  nav.bottom button .ico { font-size: 19px; }
  nav.bottom button.active { background: var(--accent); color: var(--accent-ink); box-shadow: var(--accent-glow); }

  /* Progress view */
  .prog-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px;
  }
  .prog-item h3 {
    margin: 0 0 2px; font-size: 15.5px; font-weight: 750;
    transform: scaleX(.92); transform-origin: left;
  }
  .prog-item .best {
    font-size: 12px; color: var(--ink-dim); margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  /* Dashboard y Análisis de Métricas */
  .dash-summary {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px;
  }
  .stat-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; box-shadow: var(--shadow);
  }
  .stat-box .title { font-size: 11px; font-weight: 700; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .05em; }
  .stat-box .val { font-size: 22px; font-weight: 800; margin-top: 3px; font-variant-numeric: tabular-nums; color: var(--accent); }
  .stat-box .sub { font-size: 11px; color: var(--ink-dim); margin-top: 2px; }

  .coach-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 6px;
  }
  .coach-card.good-border { border-left: 4px solid var(--good); }
  .coach-card.warn-border { border-left: 4px solid var(--pr); }
  .coach-card.bad-border { border-left: 4px solid var(--bad); }
  .coach-card h4 { margin: 0 0 6px; font-size: 14.5px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; }
  .coach-card p { margin: 0; font-size: 12.5px; color: var(--ink); line-height: 1.45; }
  .coach-card .tip { font-size: 11.5px; color: var(--ink-dim); margin-top: 6px; font-style: italic; }

  .badge-tag {
    font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; text-transform: uppercase;
  }
  .badge-good { background: var(--good-soft); color: var(--good); }
  .badge-warn { background: var(--pr-soft); color: var(--pr); }
  .badge-bad { background: var(--bad-soft); color: var(--bad); }

  .section-label {
    font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-dim); padding: 10px 4px 0;
  }

  /* Settings view */
  .settings-day { display: flex; flex-direction: column; gap: 8px; }
  .ex-row {
    display: grid;
    grid-template-columns: 1fr 46px 76px 62px 44px;
    gap: 6px; align-items: center;
    padding: 8px 0; border-top: 1px solid var(--border);
  }
  .ex-row:first-child { border-top: none; }
  .ex-row input {
    width: 100%; font: inherit; font-size: 12.5px; font-weight: 600;
    color: var(--ink); background: var(--surface-2);
    border: 1.5px solid transparent; border-radius: 8px;
    padding: 7px 6px; text-align: center;
  }
  .ex-row input.ex-name { text-align: left; font-weight: 700; }
  .ex-row input:focus-visible { outline: none; border-color: var(--accent); }
  .ex-row .del {
    width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid var(--border);
    background: var(--surface-2); color: var(--bad); font-weight: 800; cursor: pointer;
  }
  .ex-add {
    margin-top: 6px; padding: 10px; border-radius: 9px; border: 1.5px dashed var(--border);
    background: transparent; color: var(--ink-dim); font: inherit; font-weight: 700; font-size: 13px;
    cursor: pointer; width: 100%;
  }
  .field-hint { font-size: 10px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .05em; padding: 0 0 2px; }
  .hints-row { display: grid; grid-template-columns: 1fr 46px 76px 62px 44px; gap: 6px; }

  .btn-outline {
    font: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer;
    padding: 12px; border-radius: 11px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--ink); width: 100%;
  }
  .btn-danger { color: var(--bad); }
  .file-label { display: block; }
  .file-label input[type="file"] { display: none; }

  /* Vista Ruta / Cardio / GPS */
  .type-chips {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px;
  }
  .type-chips button {
    flex: none; font: inherit; font-size: 13px; font-weight: 700;
    padding: 8px 13px; border-radius: 999px; border: 1.5px solid var(--border);
    background: var(--surface-2); color: var(--ink-dim); cursor: pointer;
  }
  .type-chips button.active {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: var(--accent-glow);
  }
  .quick-km {
    display: flex; gap: 6px; margin-bottom: 10px;
  }
  .quick-km button {
    flex: 1; font: inherit; font-size: 12.5px; font-weight: 800;
    padding: 8px 4px; border-radius: 8px; border: 1.5px solid var(--border);
    background: var(--surface-2); color: var(--ink); cursor: pointer;
  }
  .route-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;
  }
  .route-field label {
    display: block; font-size: 11px; font-weight: 700; color: var(--ink-dim);
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px;
  }
  .route-field input {
    width: 100%; font: inherit; font-size: 16px; font-weight: 700;
    color: var(--ink); background: var(--surface-2);
    border: 1.5px solid transparent; border-radius: 9px; padding: 10px;
  }
  .route-field input:focus-visible { outline: none; border-color: var(--accent); }
  .gps-card {
    background: var(--surface); border: 1.5px solid var(--accent); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .gps-stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; margin: 10px 0 12px;
  }
  .gps-stats .g-val { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); }
  .gps-stats .g-lbl { font-size: 10px; font-weight: 700; color: var(--ink-dim); text-transform: uppercase; }
  .route-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 16px; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .route-item .r-main h4 { margin: 0 0 3px; font-size: 15px; font-weight: 800; }
  .route-item .r-main .r-meta { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .route-item .r-main .r-note { font-size: 12px; color: var(--ink); margin-top: 4px; opacity: .85; }
  .route-item .r-badge {
    font-size: 16px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(8px);
    background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 13px;
    padding: 10px 16px; border-radius: 999px; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    z-index: 30; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<div id="app"></div>
<div id="timer">
  <div class="box">
    <div class="clock num" id="timer-clock">2:00</div>
    <div class="exname" id="timer-name">Descanso</div>
    <button id="timer-skip">Saltar</button>
  </div>
</div>
<nav class="bottom">
  <button id="nav-train" class="active"><span class="ico">🏋️</span>Entrenar</button>
  <button id="nav-cardio"><span class="ico">🏃</span>Ruta / KM</button>
  <button id="nav-progress"><span class="ico">📈</span>Progreso</button>
  <button id="nav-settings"><span class="ico">⚙️</span>Ajustes</button>
</nav>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var DEFAULT_ROUTINE = [
    { id: "d1", name: "Potencia, Empuje y Salto (Béisbol / Basket)", short: "Día 1", optional: false,
      cardio: "Caminata inclinada o StairMaster — 10-12 min (sin impacto articular)",
      exercises: [
        { n: "Press de banca con barra", sets: 5, label: "5×5 explosivo", target: 5, rest: 120 },
        { n: "Sentadilla con salto (o con mancuernas)", sets: 4, label: "4×5 salto", target: 5, rest: 90 },
        { n: "Press militar", sets: 4, label: "4×6", target: 6, rest: 120 },
        { n: "Press inclinado con mancuernas", sets: 3, label: "3×8", target: 8, rest: 90 },
        { n: "Rotación Rusa / Core rotacional", sets: 3, label: "3×15 por lado", target: 15, rest: 45 },
        { n: "Face Pull / Manguito rotador", sets: 3, label: "3×15", target: 15, rest: 45 },
        { n: "Extensión de tríceps en polea", sets: 3, label: "3×10", target: 10, rest: 60 }
      ]},
    { id: "d2", name: "Tracción, Cadena Posterior y Bateo", short: "Día 2", optional: false,
      cardio: "HIIT en Remo o Bici — 10 min (30s sprint / 30s suave)",
      exercises: [
        { n: "Peso muerto", sets: 4, label: "4×5", target: 5, rest: 150 },
        { n: "Dominadas", sets: 4, label: "4 al fallo", target: null, rest: 90 },
        { n: "Remo con barra", sets: 4, label: "4×6-8", target: 8, rest: 120 },
        { n: "Jalón al pecho", sets: 3, label: "3×8-10", target: 10, rest: 75 },
        { n: "Landmine / Woodchopper (abajo hacia arriba)", sets: 3, label: "3×10 por lado", target: 10, rest: 60 },
        { n: "Curl martillo", sets: 3, label: "3×10", target: 10, rest: 60 },
        { n: "Curl con barra", sets: 3, label: "3×8", target: 8, rest: 60 }
      ]},
    { id: "d3", name: "Fuerza Unilateral, Agilidad y Resistencia", short: "Día 3", optional: false,
      cardio: "Bici estática suave — 10 min (recuperación activa / piernas libres)",
      exercises: [
        { n: "Sentadilla libre", sets: 5, label: "5×5", target: 5, rest: 150 },
        { n: "Zancadas / Desplantes caminando", sets: 3, label: "3×10 por pierna", target: 10, rest: 90 },
        { n: "Peso muerto rumano", sets: 4, label: "4×8", target: 8, rest: 120 },
        { n: "Hip Thrust", sets: 3, label: "3×10", target: 10, rest: 90 },
        { n: "Prensa", sets: 3, label: "3×10", target: 10, rest: 90 },
        { n: "Elevaciones laterales", sets: 3, label: "3×15", target: 15, rest: 45 },
        { n: "Plancha frontal con resistencia", sets: 3, label: "3×45s", target: null, rest: 45 }

  function haversineKm(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function formatPace(km, mins) {
    if (!km || km <= 0 || !mins || mins <= 0) return null;
    var pace = mins / km;
    var pMin = Math.floor(pace);
    var pSec = Math.round((pace - pMin) * 60);
    if (pSec === 60) { pMin++; pSec = 0; }
    return pMin + ":" + (pSec < 10 ? "0" : "") + pSec + " /km";
  }

  function startGpsTracking() {
    if (!navigator.geolocation) {

    gpsStartTime = Date.now() - (gpsElapsedSec * 1000);
    gpsLastCoords = null;

    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request("screen").catch(function () {});
    }

    gpsTimerId = setInterval(function () {
      gpsElapsedSec = Math.floor((Date.now() - gpsStartTime) / 1000);
      var elTime = document.getElementById("gps-time-val");
      var elKm = document.getElementById("gps-km-val");
      var elPace = document.getElementById("gps-pace-val");
      if (elTime) elTime.textContent = fmtClock(gpsElapsedSec);
      if (elKm) elKm.textContent = gpsTotalKm.toFixed(2);
      if (elPace) {
        var p = formatPace(gpsTotalKm, gpsElapsedSec / 60);
        elPace.textContent = p ? p.replace(" /km", "") : "--:--";
      }
    }, 1000);

    gpsWatchId = navigator.geolocation.watchPosition(function (pos) {
      var crd = pos.coords;
      if (crd.accuracy && crd.accuracy > 45) return; // ignorar lecturas imprecisas
      if (gpsLastCoords) {
        var d = haversineKm(gpsLastCoords.lat, gpsLastCoords.lon, crd.latitude, crd.longitude);
        if (d >= 0.003 && d < 0.5) { // mínimo 3 metros para filtrar ruido estático
          gpsTotalKm += d;
        }
      }
      gpsLastCoords = { lat: crd.latitude, lon: crd.longitude };
    }, function () {
      toast("Activa el permiso de ubicación en tu celular");
    }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });

    render();
    toast("📍 Rastreo GPS iniciado");
  }

  function stopGpsTracking() {
    if (gpsWatchId != null && navigator.geolocation) {
      navigator.geolocation.clearWatch(gpsWatchId);
      gpsWatchId = null;
    }
    clearInterval(gpsTimerId);
    gpsActive = false;

    var finalKm = Math.round(gpsTotalKm * 100) / 100;
    var finalMins = Math.max(1, Math.round(gpsElapsedSec / 60));

    if (finalKm > 0.05) {
      var iconObj = CARDIO_TYPES.filter(function (t) { return t.type === selectedCardioType; })[0] || CARDIO_TYPES[0];
      cardioLog.push({
        id: "c-" + Date.now(),
        date: new Date().toISOString().slice(0, 10),
        type: selectedCardioType,
        icon: iconObj.icon,
        km: finalKm,
        mins: finalMins,
        note: "Ruta medida con GPS del celular 📍"
      });
      save(CARDIO_KEY, cardioLog);
      autoSyncCloud();
      toast("¡Ruta GPS de " + finalKm + " km guardada!");
    } else {
      toast("GPS detenido (sin distancia suficiente)");
    }

    gpsElapsedSec = 0;
    gpsTotalKm = 0;
    gpsLastCoords = null;
    render();
  }

  function wireCardioEvents() {
    var startBtn = document.getElementById("gps-start-btn");

    if (stopBtn) stopBtn.addEventListener("click", stopGpsTracking);

        selectedCardioType = btn.getAttribute("data-ctype");
        app.querySelectorAll(".type-chips button").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-ctype") === selectedCardioType);
        });
      });
    });

    app.querySelectorAll(".quick-km button").forEach(function (btn) {
      btn.addEventListener("click", function () {

      });
    });

    if (saveBtn) {

        cardioLog.push({
          id: "c-" + Date.now(),
          date: dateVal,
          type: selectedCardioType,
          icon: iconObj.icon,
          km: isNaN(kmVal) ? 0 : kmVal,
          mins: isNaN(minsVal) ? null : minsVal,

  // ---- progress view ----
  function allExercises() {
    var seen = {}, out = [];
    routine.forEach(function (d) {
      d.exercises.forEach(function (ex) {
        if (seen[ex.n]) return;
        seen[ex.n] = true;
        out.push(ex);
      });
    });
    Object.keys(log).forEach(function (k) {
      if (!seen[k]) {
        seen[k] = true;
        out.push({ n: k, sets: 3, label: "", target: null, rest: 60 });
      }
    });
    return out;
  }

  function analyzePerformance() {
    var strengths = [];
    var weaknesses = [];
    var totalSessions = 0;
    var allEx = allExercises();

    // Analizar Cardio y Rutas (Caminata, Running, Ciclismo)
    var totalKm = cardioLog.reduce(function (acc, r) { return acc + (parseFloat(r.km) || 0); }, 0);
    if (totalKm > 0) {
      var lastRoute = cardioLog[cardioLog.length - 1];
      strengths.push({
        name: "Cardio y Resistencia en Ruta (" + totalKm.toFixed(1) + " km)",
        text: "Llevas " + cardioLog.length + (cardioLog.length === 1 ? " salida registrada" : " salidas registradas") +
              " (última: " + lastRoute.type + " de " + lastRoute.km + " km el " + lastRoute.date + "). Excelente para resistencia y recuperación activa.",
        tag: "Aeróbico",
        type: "good"
      });
    } else {
      weaknesses.push({
        name: "Cardio / Salidas de Ruta",
        text: "Aún no tienes caminatas, carreras o salidas en bici registradas.",
        tip: "Usa la pestaña '🏃 Ruta / KM' para anotar tus caminatas de 3K o medir tu ruta con el GPS.",
        tag: "Cardio",
        type: "warn"
      });
    }

    allEx.forEach(function (ex) {
      var h = log[ex.n];
      if (!h || !h.sessions || !h.sessions.length) return;
      totalSessions += h.sessions.length;

      var s = h.sessions;
      var first = s[0];
      var last = s[s.length - 1];

      var firstMax = first.sets.reduce(function (m, x) { return Math.max(m, x.weight || 0); }, 0);
      var lastMax = last.sets.reduce(function (m, x) { return Math.max(m, x.weight || 0); }, 0);
      var allMax = s.map(function (ses) { return ses.sets.reduce(function (m, x) { return Math.max(m, x.weight || 0); }, 0); });
      var peakMax = Math.max.apply(null, allMax);

      if (s.length >= 2 && lastMax > firstMax) {
        var diff = lastMax - firstMax;
        strengths.push({
          name: ex.n,
          text: "Ganancia de +" + diff + " lb (de " + firstMax + " a " + lastMax + " lb). Progresión sólida de sobrecarga.",
          tag: "Mejora",
          type: "good"
        });
      } else if (s.length >= 3 && peakMax > 0 && lastMax === peakMax) {
        strengths.push({
          name: ex.n,
          text: "En tu marca máxima histórica (" + peakMax + " lb). Listo para buscar salto de carga o reps.",
          tag: "Poder pico",
          type: "good"
        });
      }

      if (s.length >= 2 && lastMax < peakMax && peakMax > 0) {
        var drop = peakMax - lastMax;
        weaknesses.push({
          name: ex.n,
          text: "Bajó -" + drop + " lb respecto a tu récord (" + peakMax + " lb). Posible fatiga acumulada o falta de descanso.",
          tip: "Recomendación: asegurar 48h de recuperación y descanso de 90s a 120s entre series.",
          tag: "Retroceso",
          type: "warn"
        });
      } else if (s.length >= 3 && lastMax === firstMax && lastMax > 0) {
        weaknesses.push({
          name: ex.n,
          text: "Mismo peso (" + lastMax + " lb) en " + s.length + " sesiones consecutivas.",
          tip: "Recomendación: intenta sumar 1 sola repetición extra antes de subir peso (sobrecarga progresiva).",
          tag: "Estancado",
          type: "warn"
        });
      }
    });

    var squadLog = log["Sentadilla libre"] || log["Prensa"];
    if (!squadLog || !squadLog.sessions || squadLog.sessions.length === 0) {
      weaknesses.push({
        name: "Tren Inferior (Piernas y Salto)",
        text: "Pocas sesiones registradas en piernas en comparación con empuje y tracción.",
        tip: "Clave para tus deportes: las piernas generan el salto vertical en basket y el sprint en softbol.",
        tag: "Prioridad",
        type: "bad"
      });
    }

    return {
      strengths: strengths,
      weaknesses: weaknesses,
      totalSessions: totalSessions,
      totalKm: totalKm
    };
  }

      });

        '<canvas data-values="' + maxes.join(",") + '" width="300" height="44"></canvas></div>';
    });

    if (!any) {
      html += '<div class="prog-empty">Aún no hay sesiones guardadas.<br>Entra a <b>Entrenar</b> o importa tus datos para ver el análisis.</div>';
    }

    html += '</main>';

  function drawSpark(canvas) {
    var values = canvas.getAttribute("data-values").split(",").map(Number);
    var ctx = canvas.getContext("2d");
    var w = canvas.width, h = canvas.height, pad = 6;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if (min === max) { min -= 5; max += 5; }
    var styles = getComputedStyle(document.documentElement);
    var accent = styles.getPropertyValue("--accent").trim();
    var border = styles.getPropertyValue("--border").trim();

    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = border; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, h - pad); ctx.lineTo(w, h - pad); ctx.stroke();

    var pts = values.map(function (v, i) {
      var x = pad + (i / (values.length - 1 || 1)) * (w - pad * 2);
      var y = h - pad - ((v - min) / (max - min)) * (h - pad * 2);
      return [x, y];
    });

    ctx.beginPath();
    pts.forEach(function (p, i) { i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]); });
    ctx.lineTo(pts[pts.length - 1][0], h - pad); ctx.lineTo(pts[0][0], h - pad); ctx.closePath();
    ctx.fillStyle = accent + "22"; ctx.fill();

    ctx.beginPath();
    pts.forEach(function (p, i) { i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]); });
    ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.stroke();

    var last = pts[pts.length - 1];
    ctx.beginPath(); ctx.arc(last[0], last[1], 3, 0, Math.PI * 2);
    ctx.fillStyle = accent; ctx.fill();
  }

  // ---- Sincronización en la nube (GitHub Gist) ----
  function getFullPayload() {
    return {
      routine: routine,
      log: log,
      cardioLog: cardioLog,
      notes: notes,
      lastDay: lastDay,
      exportedAt: new Date().toISOString()
    };
  }

  function autoSyncCloud() {
    if (!cloudConf || !cloudConf.token) return;
    pushToCloud(true);
  }

  function pushToCloud(silent) {
    if (!cloudConf.token) {
      if (!silent) toast("Ingresa tu token de cuenta en Ajustes");
      return;
    }
    var payloadStr = JSON.stringify(getFullPayload(), null, 2);
    var url = cloudConf.gistId ? "https://api.github.com/gists/" + cloudConf.gistId : "https://api.github.com/gists";
    var method = cloudConf.gistId ? "PATCH" : "POST";

    fetch(url, {
      method: method,
      headers: {
        "Authorization": "token " + cloudConf.token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        description: "PH Power - Sincronización de Entrenamiento y Rutas",
        public: false,
        files: {
          "ph-power-sync.json": { content: payloadStr }
        }
      })
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data && data.id) {
        cloudConf.gistId = data.id;
        save(CLOUD_KEY, cloudConf);
        if (!silent) {
          toast("☁️ Sincronizado en tu cuenta");
          if (activeView === "settings") renderSettings();
        }
      } else if (!silent) {
        toast("Error al sincronizar con la cuenta");
      }
    }).catch(function () {
      if (!silent) toast("Sin conexión para sincronizar");
    });
  }

  function pullFromCloud() {
    var gid = cloudConf.gistId || DEFAULT_GIST_ID;
    if (!gid) {
      toast("Ingresa un ID de Sincronización");
      return;
    }
    var hdrs = { "Accept": "application/vnd.github+json" };
    if (cloudConf.token) hdrs["Authorization"] = "token " + cloudConf.token;

    fetch("https://api.github.com/gists/" + gid, {
      headers: hdrs
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data && data.files && data.files["ph-power-sync.json"]) {
        var content = JSON.parse(data.files["ph-power-sync.json"].content);
        if (content.routine) routine = content.routine;
        if (content.log) log = content.log;
        if (content.cardioLog) cardioLog = content.cardioLog;
        if (content.notes) notes = content.notes;
        if (content.lastDay) lastDay = content.lastDay;
        saveRoutine();
        save(STORE_KEY, log);
        save(CARDIO_KEY, cardioLog);
        save(NOTES_KEY, notes);
        save(LASTDAY_KEY, lastDay);
        toast("☁️ Datos descargados de tu cuenta");
        renderSettings();
      } else {
        toast("No se encontró respaldo en ese Gist");
      }
    }).catch(function () {
      toast("Error al descargar de la nube");
    });
  }

    var html = '<header class="top"><div class="kicker">Personalizar</div><h1>AJUSTES</h1></header>';
    html += '<main>';

    html += '<div class="section-label">☁️ Sincronización con Cuenta y Celular</div>';
    html += '<div class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px;">' +
      '<div style="font-size:12.5px;color:var(--ink-dim);line-height:1.4;">' +
        'Conecta un <b>Token de GitHub (scope: gist)</b> para que cada serie y caminata de 3K se respalde automáticamente en tu cuenta entre tu celular y tu PC.' +
      '</div>' +
      '<div class="route-field"><label>Token de Cuenta (GitHub Personal Token)</label>' +
        '<input type="password" id="cloud-token" placeholder="ghp_..." value="' + escapeAttr(cloudConf.token || "") + '"></div>' +
      '<div class="route-field"><label>ID de Sincronización (Se genera solo al subir)</label>' +
        '<input type="text" id="cloud-gist" placeholder="Automático al sincronizar" value="' + escapeAttr(cloudConf.gistId || "") + '"></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
        '<button class="btn-outline" id="cloud-push-btn" style="border-color:var(--accent);color:var(--accent);">☁️ Subir a Nube</button>' +
        '<button class="btn-outline" id="cloud-pull-btn">☁️ Traer de Nube</button>' +
      '</div>' +
      '<button class="btn-outline" id="share-native-btn">📲 Compartir / Enviar a mi Celular o Nube</button>' +
      '</div>';

    routine.forEach(function (day) {
      html += '<div class="section-label">' + day.short + ' — ' + escapeHtml(day.name) + '</div>';
      html += '<div class="card" style="padding:12px 16px;"><div class="hints-row">' +
        '<span class="field-hint">Ejercicio</span><span class="field-hint">Series</span>' +
        '<span class="field-hint">Etiqueta</span><span class="field-hint">Descanso</span><span></span></div>';
      html += '<div class="settings-day" data-day="' + day.id + '">';
      day.exercises.forEach(function (ex, i) {
        html += '<div class="ex-row" data-idx="' + i + '">' +
          '<input class="ex-name" data-f="n" value="' + escapeAttr(ex.n) + '">' +
          '<input data-f="sets" type="number" min="1" value="' + ex.sets + '">' +
          '<input data-f="label" value="' + escapeAttr(ex.label) + '">' +
          '<input data-f="rest" type="number" min="0" step="5" value="' + ex.rest + '">' +
          '<button class="del" data-idx="' + i + '" aria-label="Eliminar ejercicio">✕</button>' +
          '</div>';
      });
      html += '</div>';
      html += '<button class="ex-add" data-day="' + day.id + '">+ Agregar ejercicio</button>';
      html += '</div>';
    });

    html += '<div class="section-label">Rutina</div>';
    html += '<button class="btn-outline btn-danger" id="restore-btn">Restaurar rutina original</button>';

    html += '<div class="section-label">Aplicación de Celular</div>';
    html += '<button class="btn-outline" id="install-btn" style="display:' + (deferredInstallPrompt ? 'block' : 'none') + ';">📲 Instalar en pantalla de inicio</button>';
    html += '<div style="font-size:12px;color:var(--ink-dim);padding:6px 4px;line-height:1.4;">' +
      '💡 Funciona 100% offline en el gimnasio. En iPhone o Android puedes tocar el menú compartir/opciones de tu navegador y elegir <b>"Agregar a pantalla de inicio"</b> para abrirla sin barra de navegador.' +
      '</div>';

    html += '<div class="section-label">Respaldo Manual</div>';
    html += '<button class="btn-outline" id="export-btn">⬇ Exportar datos (JSON)</button>';
    html += '<label class="file-label"><span class="btn-outline" style="display:block;">⬆ Importar datos (JSON)</span>' +
      '<input type="file" id="import-file" accept="application/json"></label>';

    html += '</main>';
    app.innerHTML = html;
    wireSettingsEvents();
  }

  function saveRoutine() { save(ROUTINE_KEY, routine); }

  function wireSettingsEvents() {
    var tokInput = document.getElementById("cloud-token");
    var gistInput = document.getElementById("cloud-gist");
    if (tokInput) {
      tokInput.addEventListener("change", function () {
        cloudConf.token = tokInput.value.trim();
        save(CLOUD_KEY, cloudConf);
      });
    }
    if (gistInput) {
      gistInput.addEventListener("change", function () {
        cloudConf.gistId = gistInput.value.trim();
        save(CLOUD_KEY, cloudConf);
      });
    }
    var pushBtn = document.getElementById("cloud-push-btn");
    if (pushBtn) {
      pushBtn.addEventListener("click", function () {
        if (tokInput) cloudConf.token = tokInput.value.trim();
        if (gistInput) cloudConf.gistId = gistInput.value.trim();
        save(CLOUD_KEY, cloudConf);
        pushToCloud(false);
      });
    }
    var pullBtn = document.getElementById("cloud-pull-btn");
    if (pullBtn) {
      pullBtn.addEventListener("click", function () {
        if (tokInput) cloudConf.token = tokInput.value.trim();
        if (gistInput) cloudConf.gistId = gistInput.value.trim();
        save(CLOUD_KEY, cloudConf);
        pullFromCloud();
      });
    }
    var shareBtn = document.getElementById("share-native-btn");
    if (shareBtn) {
      shareBtn.addEventListener("click", function () {
        var payloadStr = JSON.stringify(getFullPayload(), null, 2);
        var fileName = "ph-power-backup-" + new Date().toISOString().slice(0, 10) + ".json";
        if (navigator.share) {
          var file = new File([payloadStr], fileName, { type: "application/json" });
          var shareData = { title: "PH Power Respaldo", text: "Mis métricas de entrenamiento y rutas PH Power" };
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            shareData.files = [file];
          }
          navigator.share(shareData).catch(function () {});
        } else {
          document.getElementById("export-btn").click();
        }
      });
    }

    app.querySelectorAll(".settings-day").forEach(function (block) {
      var dayId = block.getAttribute("data-day");
      var day = routine.filter(function (d) { return d.id === dayId; })[0];

      block.querySelectorAll(".ex-row input").forEach(function (inp) {
        inp.addEventListener("change", function () {
          var row = inp.closest(".ex-row");
          var idx = parseInt(row.getAttribute("data-idx"), 10);
          var field = inp.getAttribute("data-f");
          var ex = day.exercises[idx];
          if (field === "sets") ex.sets = Math.max(1, parseInt(inp.value, 10) || 1);
          else if (field === "rest") ex.rest = Math.max(0, parseInt(inp.value, 10) || 0);
          else ex[field] = inp.value;
          saveRoutine();
        });
      });

      block.querySelectorAll(".del").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var idx = parseInt(btn.getAttribute("data-idx"), 10);
          day.exercises.splice(idx, 1);
          saveRoutine();
          renderSettings();
        });
      });
    });

    app.querySelectorAll(".ex-add").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var day = routine.filter(function (d) { return d.id === btn.getAttribute("data-day"); })[0];
        day.exercises.push({ n: "Nuevo ejercicio", sets: 3, label: "3×10", target: 10, rest: 75 });
        saveRoutine();
        renderSettings();
      });
    });

    document.getElementById("restore-btn").addEventListener("click", function () {
      if (!confirm("Esto restablece la rutina al plan atlético original de 3 días (Potencia y Deportes). ¿Continuar?")) return;
      routine = JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
      saveRoutine();
      renderSettings();
      toast("Rutina restaurada");
    });

    document.getElementById("export-btn").addEventListener("click", function () {
      var payload = getFullPayload();
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "ph-power-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast("Respaldo descargado");
    });

    document.getElementById("import-file").addEventListener("change", function (e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(reader.result);
          if (data.routine) routine = data.routine;
          if (data.log) log = data.log;
          if (data.cardioLog) cardioLog = data.cardioLog;
          if (data.notes) notes = data.notes;
          if (data.lastDay) lastDay = data.lastDay;
          saveRoutine();
          save(STORE_KEY, log);
          save(CARDIO_KEY, cardioLog);
          save(NOTES_KEY, notes);
          save(LASTDAY_KEY, lastDay);
          suggestedId = suggestedDayId();
          toast("Datos importados");
          renderSettings();
        } catch (err) {
          toast("Archivo inválido");
        }
      };
      reader.readAsText(file);
    });

    var installBtn = document.getElementById("install-btn");
    if (installBtn && deferredInstallPrompt) {
      installBtn.addEventListener("click", function () {
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.then(function (choice) {
          if (choice.outcome === "accepted") {
            toast("¡Instalando app!");
          }
          deferredInstallPrompt = null;
          installBtn.style.display = "none";
        });
      });
    }
  }

  var deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstallPrompt = e;
    var btn = document.getElementById("install-btn");
    if (btn) btn.style.display = "block";
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (err) {
        console.warn("ServiceWorker error:", err);
      });
    });
  }

  document.getElementById("nav-train").addEventListener("click", function () {
    setView("train");
  });
  document.getElementById("nav-cardio").addEventListener("click", function () {
    setView("cardio");
  });
  document.getElementById("nav-progress").addEventListener("click", function () {
    setView("progress");
  });
  document.getElementById("nav-settings").addEventListener("click", function () {
    setView("settings");
  });

  function setView(v) {
    activeView = v;
    ["train", "cardio", "progress", "settings"].forEach(function (name) {
      var el = document.getElementById("nav-" + name);
      if (el) el.classList.toggle("active", name === v);
    });
    render();
  }

  render();
})();
</script>
