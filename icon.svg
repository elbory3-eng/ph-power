<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1c17" />
      <stop offset="100%" stop-color="#12110c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b4a" />
      <stop offset="100%" stop-color="#b5391f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5cf68" />
      <stop offset="100%" stop-color="#d8ac3d" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#2e2b22" stroke-width="4" opacity="0.6" />

  <!-- Dumbbell / Weight Plates Icon -->
  <g transform="translate(0, -10)">
    <!-- Central Bar -->
    <rect x="160" y="244" width="192" height="24" rx="12" fill="#ece5d2" opacity="0.9" />

    <!-- Center Grips / Knurling -->
    <rect x="220" y="240" width="72" height="32" rx="6" fill="#3a362a" stroke="#ece5d2" stroke-width="2" />
    <line x1="240" y1="243" x2="240" y2="269" stroke="#ece5d2" stroke-width="2" opacity="0.5" />
    <line x1="256" y1="243" x2="256" y2="269" stroke="#ece5d2" stroke-width="2" opacity="0.5" />
    <line x1="272" y1="243" x2="272" y2="269" stroke="#ece5d2" stroke-width="2" opacity="0.5" />

    <!-- Inner Plates Left -->
    <rect x="136" y="196" width="22" height="120" rx="8" fill="url(#accentGrad)" />
    <!-- Outer Plates Left -->
    <rect x="96" y="172" width="34" height="168" rx="10" fill="url(#goldGrad)" />
    <!-- Collar Left -->
    <rect x="80" y="234" width="14" height="44" rx="4" fill="#ece5d2" />

    <!-- Inner Plates Right -->
    <rect x="354" y="196" width="22" height="120" rx="8" fill="url(#accentGrad)" />
    <!-- Outer Plates Right -->
    <rect x="382" y="172" width="34" height="168" rx="10" fill="url(#goldGrad)" />
    <!-- Collar Right -->
    <rect x="418" y="234" width="14" height="44" rx="4" fill="#ece5d2" />
  </g>

  <!-- Typography: PH POWER -->
  <text x="256" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="4" fill="#ece5d2" text-anchor="middle">
    PH <tspan fill="#ff6b4a">POWER</tspan>
  </text>
  <text x="256" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="6" fill="#9c927b" text-anchor="middle">
    WORKOUT LOG
  </text>
</svg>
